name: CI branche

# Pre-validation sans publication : push d'une branche milestone ou lancement manuel.
# Le verdict conditionne la fermeture des issues DONE et la barriere PUBLISH PROD.
on:
  push:
    branches:
      - 'milestone/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: CI
        run: bash scripts/ci.sh
